services:
  web:
    image: php:8.2-apache
    command: bash -c "a2enmod rewrite headers && apache2-foreground"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/apache-site.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: furniture_platform
      DB_USER: furniture_user
      DB_PASSWORD: strong_password_here
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      SESSION_SECURE: "false"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: furniture_platform
      MYSQL_USER: furniture_user
      MYSQL_PASSWORD: strong_password_here
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
