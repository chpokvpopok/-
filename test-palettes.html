<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор цветовой палитры</title>
    <style id="palette-css"></style>
    <style>
        .palette-switcher {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 2px solid #ccc;
            padding: 20px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .palette-switcher button {
            padding: 10px 20px;
            border: 2px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .palette-switcher button:hover {
            background: #f0f0f0;
        }

        .palette-switcher button.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        .palette-info {
            font-size: 13px;
            color: #666;
            margin-left: auto;
        }

        body {
            margin-top: 120px;
        }

        .palette-colors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            background: var(--color-bg);
        }

        .color-sample {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .color-box {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 2px solid #eee;
        }

        .color-name {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .color-code {
            font-family: monospace;
            font-size: 12px;
            color: var(--color-text-secondary);
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="palette-switcher">
        <button class="palette-btn" data-css="site-warm.css">🏡 Теплая</button>
        <button class="palette-btn" data-css="site-modern.css">⬜ Современная</button>
        <button class="palette-btn" data-css="site-eco.css">🌿 Эко</button>
        <button class="palette-btn" data-css="site-luxury.css">✨ Люкс</button>
        <div class="palette-info">Нажмите на кнопку, чтобы переключить палитру</div>
    </div>

    <div class="palette-colors">
        <div class="color-sample">
            <div class="color-box" style="background: var(--color-bg);"></div>
            <div class="color-name">Фон (--color-bg)</div>
            <div class="color-code" id="color-bg"></div>
        </div>

        <div class="color-sample">
            <div class="color-box" style="background: var(--color-surface);"></div>
            <div class="color-name">Поверхность (--color-surface)</div>
            <div class="color-code" id="color-surface"></div>
        </div>

        <div class="color-sample">
            <div class="color-box" style="background: var(--color-accent);"></div>
            <div class="color-name">Акцент (--color-accent)</div>
            <div class="color-code" id="color-accent"></div>
        </div>

        <div class="color-sample">
            <div class="color-box" style="background: var(--color-accent-strong);"></div>
            <div class="color-name">Акцент сильный (--color-accent-strong)</div>
            <div class="color-code" id="color-accent-strong"></div>
        </div>

        <div class="color-sample">
            <div class="color-box" style="background: var(--color-text);"></div>
            <div class="color-name">Текст (--color-text)</div>
            <div class="color-code" id="color-text"></div>
        </div>

        <div class="color-sample">
            <div class="color-box" style="background: var(--color-text-secondary);"></div>
            <div class="color-name">Текст вторичный (--color-text-secondary)</div>
            <div class="color-code" id="color-text-secondary"></div>
        </div>

        <div class="color-sample">
            <div class="color-box" style="background: var(--color-border);"></div>
            <div class="color-name">Граница (--color-border)</div>
            <div class="color-code" id="color-border"></div>
        </div>
    </div>

    <script>
        const paletteBtn = document.querySelectorAll('.palette-btn');
        const paletteCss = document.getElementById('palette-css');

        function loadPalette(cssFile) {
            fetch(`../css/${cssFile}`)
                .then(res => res.text())
                .then(css => {
                    // Извлекаем только :root блок
                    const match = css.match(/:root\s*{([^}]+)}/);
                    if (match) {
                        paletteCss.textContent = `:root {${match[1]}}`;
                        updateColorCodes();

                        // Обновляем активную кнопку
                        paletteBtn.forEach(btn => {
                            btn.classList.remove('active');
                            if (btn.dataset.css === cssFile) {
                                btn.classList.add('active');
                            }
                        });

                        // Сохраняем выбор в localStorage
                        localStorage.setItem('selectedPalette', cssFile);
                    }
                });
        }

        function updateColorCodes() {
            const root = document.documentElement;
            const colors = [
                'color-bg',
                'color-surface',
                'color-accent',
                'color-accent-strong',
                'color-text',
                'color-text-secondary',
                'color-border'
            ];

            colors.forEach(colorName => {
                const value = getComputedStyle(root).getPropertyValue(`--${colorName}`).trim();
                const elem = document.getElementById(colorName);
                if (elem) {
                    elem.textContent = value;
                }
            });
        }

        paletteBtn.forEach(btn => {
            btn.addEventListener('click', () => {
                loadPalette(btn.dataset.css);
            });
        });

        // Загружаем сохраненную палитру или первую по умолчанию
        const savedPalette = localStorage.getItem('selectedPalette') || 'site-warm.css';
        loadPalette(savedPalette);
    </script>
</body>

</html>
